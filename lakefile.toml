name = "primeGapsLean"
version = "0.1.0"
keywords = ["math", "number-theory", "prime-gaps"]
defaultTargets = ["PrimeGapsDevelopment"]
fixedToolchain = true
weakLeanArgs = ["-j1", "-DElab.async=false", "-M30000"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "bbcd1968ee6950abe88b85dba6995da346c4b2a8"

# Unchanged public baseline; its mathematical axioms are documented separately.
[[lean_lib]]
name = "PrimeGaps186"
srcDir = "vendor/primegaps186"
roots = ["PrimeGaps186"]
globs = ["PrimeGaps186"]

[lean_lib.leanOptions]
linter.mathlibStandardSet = true

# Flat module names are preserved to keep all imported proofs byte-identical.
